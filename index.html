<!doctype html>
<html>
  <head>
    <title>Guru Offline - SMK NU Ungaran</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistem Informasi Akademik & Pengajaran Guru Offline SMK NU Ungaran berbasis IndexedDB."
    />
    <meta property="og:title" content="Guru Offline - SMK NU Ungaran" />
    <meta
      property="og:description"
      content="Sistem Informasi Akademik & Pengajaran Guru Offline SMK NU Ungaran berbasis IndexedDB."
    />
    <link rel="shortcut icon" type="image/x-icon" href="src/assets/images/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
